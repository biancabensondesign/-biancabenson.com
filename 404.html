<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Page Not Found</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      box-sizing: border-box;
      line-height: 1.3;
      margin: 0;
    }

    html {
      display: table;
      height: 100%;
      width: 100%;
      background: #F4F6FB;
      color: #1B2230;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-align: center;
    }

    body {
      display: table-cell;
      vertical-align: middle;
      padding: 2em 1em;
    }

    h1 {
      font-family: Georgia, serif;
      font-weight: 400;
      font-size: 2.4em;
      color: #1B2230;
      margin-bottom: 0.3em;
    }

    p {
      margin: 0 auto;
      max-width: 320px;
      color: #5C6373;
    }

    a {
      display: inline-block;
      margin-top: 1.4em;
      color: #333F9E;
      font-weight: 600;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      text-decoration: underline;
    }

    @media only screen and (max-width: 280px) {

      body,
      p {
        width: 95%;
      }

      h1 {
        font-size: 1.7em;
      }
    }
  </style>
</head>

<body>
  <h1>Page not found</h1>
  <p>Sorry, the page you were looking for doesn't exist.</p>
  <a href="/">← Back to biancabenson.com</a>
</body>

</html>
